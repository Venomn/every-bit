<script>
(()=>{
// Small, deterministic teaching worlds. No network, shell, or downloaded code.

const labRules = {
  schedule: {tick: true, pause: [0,1]}, memory: {address:[0,15], value:[0,255], write:true, read:true},
  branch:{step:true,rule:true}, color:{select:[0,3],paint:[0,15],depth:[1,2]},
  cpu:{step:true}, drivers:{toggle:['keyboard','disk'],key:true,save:true},
  files:{command:'text'}, patch:{fix:true,test:true,share:true},
  modem:{flip:[0,7],send:true,speed:[1,4]}, packets:{deliver:[0,3],drop:[0,3]},
  dns:{name:['book.test','moon.test','missing.test'],lookup:true,move:true,expire:true,visit:true},
  web:{title:'text',path:['/','/moon','/missing'],request:true,follow:true},
  touch:{tap:[0,15]}, unicode:{text:'text',byte:[0,127]},
  cloud:{online:true,edit:['A','B'],sync:['A','B'],resolve:['A','B']},
  learn:{label:['round','long'],sample:[0,5],test:true},
  message:{text:'text',encode:true,send:true,deliver:[0,31],store:true,open:true}
};
function cleanLabAction(key, event) {
  if (!LAB_KEYS.includes(key) || !event || typeof event !== 'object' || !Object.hasOwn(labRules[key],event.type)) return null;

  if(rule===true) return {type:event.type};
  if(rule==='text') return typeof event.value==='string'?{type:event.type,value:[...event.value].slice(0,key==='files'?80:24).join('')}:null;
  if(typeof rule[0]==='number') return Number.isInteger(event.value)&&event.value>=rule[0]&&event.value<=rule[1]?{type:event.type,value:event.value}:null;

}
function cleanLabLogs(raw) {
  const result={};
  if(!raw||typeof raw!=='object'||Array.isArray(raw))return result;
  for(const key of LAB_KEYS) if(Array.isArray(raw[key])) result[key]=raw[key].slice(0,LAB_ACTION_LIMIT).map(e=>cleanLabAction(key,e)).filter(Boolean);

    branch:{position:0,rule:false,crashed:false},
    color:{pixels:Array(16).fill(0),selected:1,depth:1,painted:false},
    cpu:{pc:0,phase:0,acc:0,output:null,ir:null,cycles:0},
    drivers:{keyboard:false,disk:false,buffer:'',file:'',blocked:false},
    files:{cwd:'/',dirs:['/','/notes'],files:{'/hello.txt':'HELLO, LINUX!'},output:['输入 help 看命令。'],created:false},
    patch:{fixed:false,tests:null,shared:false,friendFixed:false},
    modem:{bits:[0,1,0,0,0,0,0,1],speed:1,received:null,sentSeconds:null,sentSlow:false,sentFast:false},
    packets:{received:[],dropped:[],arrivals:[],duplicates:0},
    dns:{name:'book.test',cache:{},servers:{'book.test':'192.0.2.1','moon.test':'192.0.2.2'},address:null,moved:false,stale:false},
    web:{title:'我的第一张网页',path:'/',loaded:null,requested:false,followed:false},
    touch:{cell:null,apps:[]}, unicode:{text:'A',selected:0,seen:[]},

      if(s.phase===1)s.feedback=`译码：${{LOAD:'把 2 放进小盒子',ADD:'给小盒子加 3',OUT:'把小盒子的值送到屏幕',HALT:'停止取下一条'}[s.ir[0]]}。`;

function replayLab(key, events=[]) {

// Book progress and migration of the original limited BASIC sample.
const STORAGE_KEY = 'every-bit.v1';
const LESSON_COUNT = 23;
const toBits = value => (value & 255).toString(2).padStart(8, '0');
const fromBits = bits => bits.reduce((n, bit) => n * 2 + Number(Boolean(bit)), 0);

function cleanProgram(value) {
  if (!value || typeof value !== 'object' || Array.isArray(value)) return {};

const wEsc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wBits = n => n.toString(2).padStart(8,'0');
function wb(type,label,value,disabled=false,pressed=null) {
  return `<button type="button" class="world-button" data-world="${type}"${value!==undefined?` data-value="${wEsc(value)}"`:''}${disabled?' disabled':''}${pressed!==null?` aria-pressed="${pressed}"`:''}>${label}</button>`;
}
const wForm=(type,label,value,placeholder='')=>`<form data-world-form="${type}" class="world-form"><label>${label}<input name="value" value="${wEsc(value)}" maxlength="${type==='command'?80:48}" placeholder="${wEsc(placeholder)}" autocomplete="off" spellcheck="false"></label><button class="world-button" type="submit">${type==='command'?'执行 ↵':'应用 ↵'}</button></form>`;
const wMeter=(n,max)=>`<div class="world-meter" role="img" aria-label="${n}/${max}">${Array.from({length:max},(_,i)=>`<i class="${i<n?'filled':''}"></i>`).join('')}</div>`;
const wCard=(label,body)=>`<div class="world-card"><span class="eyebrow">${label}</span>${body}</div>`;
const palette=['#f9f7e9','#263d33','#ce603e','#9baa55'];
function renderLab(key,s) {

    case 'modem': {
      const wave=s.bits.map((bit,i)=>{const count=bit?4:2;return Array.from({length:count*2+1},(_,j)=>`${i*50+j*50/(count*2)},${40+(j%2?20:-20)}`).join(' ');}).join(' ');
      body=`<div class="modem-box"><div class="modem-lights"><i></i><i></i><i></i><span>DATA / TELEPHONE LINE</span></div><div class="signal-bits">${s.bits.map((b,i)=>wb('flip',String(b),i,false,!!b)).join('')}</div><svg class="signal-wave" viewBox="0 0 400 80" role="img" aria-label="用两种频率表示 0 和 1 的教学波形"><polyline points="${wave}" fill="none" stroke="currentColor" stroke-width="2"/></svg><div class="world-controls">${wb('speed','1 bit/秒',1,false,s.speed===1)}${wb('speed','4 bit/秒',4,false,s.speed===4)}</div></div><div class="world-controls">${wb('send','发送这 8 个 bit →')}</div><div class="receiver"><span>另一端</span><code>${s.received?s.received.join(''):'????????'}</code><b>${s.received?s.sentSeconds+' 秒':'等待信号'}</b></div>`;break;

const VIC_TOKENS = ('END|FOR|NEXT|DATA|INPUT#|INPUT|DIM|READ|LET|GOTO|RUN|IF|RESTORE|GOSUB|RETURN|REM|STOP|ON|WAIT|LOAD|SAVE|VERIFY|DEF|POKE|PRINT#|PRINT|CONT|LIST|CLR|CMD|SYS|OPEN|CLOSE|GET|NEW|TAB(|TO|FN|SPC(|THEN|NOT|STEP|+|-|*|/|^|AND|OR|>|=|<|SGN|INT|ABS|USR|FRE|POS|SQR|RND|LOG|EXP|COS|SIN|TAN|ATN|PEEK|LEN|STR$|VAL|ASC|CHR$|LEFT$|RIGHT$|MID$|GO').split('|');
const vicDecode = value => Uint8Array.from(atob(value), c=>c.charCodeAt(0));
const vicEncode = bytes => btoa(Array.from(bytes,c=>String.fromCharCode(c)).join(''));
function vicInput(text, program=false) {
  const upper=String(text).replace(/\r\n?/g,'\n').toUpperCase();
  const lines=upper.split('\n').filter(line=>line.trim());
  const seen=new Set();
  for(const [index,line] of lines.entries()) {
    if(/[^\x20-\x5F\x61-\x7A{}]/.test(line)) throw new Error(`第 ${index+1} 行：老电脑请用英文字母、数字和英文标点。`);
    if(line.length>88) throw new Error(`第 ${index+1} 行超过 VIC-20 的 88 个字符，请拆成几行。`);
    if(program) {
      const m=line.match(/^\s*(\d+)\s*/);
      if(!m||+m[1]>63999) throw new Error(`第 ${index+1} 行需要 0–63999 之间的行号，例如 10 PRINT "HELLO"。`);
      if(seen.has(+m[1])) throw new Error(`行号 ${+m[1]} 重复了，给它另一个号码。`);
      seen.add(+m[1]);
    }
  }
  if(upper.length>32000) throw new Error('这份笔记太大了，请拆成几个作品。');
  return lines.join('\r')+(lines.length?'\r':'');
}
// Read a linked, tokenized BASIC program. Validation happens before any RAM write.
function vicReadPRG(bytes, expectedStart) {
  if(!(bytes instanceof Uint8Array)||bytes.length<4||bytes.length>28674) throw new Error('这不是完整的 VIC-20 BASIC PRG 文件。');
  const start=bytes[0]+256*bytes[1];
  if((start===4097&&start+bytes.length-2>7680)||(start===4609&&start+bytes.length-2>32768))throw new Error('PRG 超出了这台电脑的 BASIC 内存。');
  if(expectedStart!==undefined&&start!==expectedStart) throw new Error(`程序起点是 ${start.toString(16)}，与这台电脑的内存配置不同。请切换内存后重试。`);
  if(start!==4097&&start!==4609) throw new Error('目前作品盒支持 BASIC PRG（未扩展或 24K 扩展），不载入磁带、卡带和任意机器码文件。');
  let offset=2, previous=-1;const lines=[];
  while(offset+1<bytes.length) {
    const next=bytes[offset]+256*bytes[offset+1];
    if(!next) {
      if(offset+2!==bytes.length) throw new Error('PRG 尾部有无法识别的数据。');
      return {start,end:start+bytes.length-2,source:lines.join('\n')};
    }
    const target=next-start+2;
    if(target<=offset+4||target>bytes.length-2||bytes[target-1]!==0) throw new Error('PRG 的行链接损坏，原来的作品没有被替换。');

      const c=bytes[i];

      if(!quote&&!rem&&!data&&c>=128&&c<128+VIC_TOKENS.length) {
        code+=VIC_TOKENS[c-128];if(c===143)rem=true;if(c===131)data=true;
      } else if(c>=32&&c<=95)code+=String.fromCharCode(c);
      else code+=`{PET:${c}}`;
    }

  }

class VIC20 {

  }

  word(address){return this.peek(address)+256*this.peek(address+1);}
  setWord(address,value){this.core.poke_ram(address,value&255);this.core.poke_ram(address+1,value>>8);}
  advance(us=20000){

    });

const vicDefaultSource='10 PRINT "HELLO, MY COMPUTER!"\n20 PRINT 2+3\n30 GOTO 10';
function vicRestoreLibrary(raw,legacy={}){
  const base={version:1,draft:vicDefaultSource,name:'我的第一个程序',expanded:false,session:null,works:[]};
  const oldSource=p=>Object.entries(p||{}).sort((a,b)=>+a[0]-b[0]).map(([n,s])=>`${n} ${s}`).join('\n');
  try{
    const data=typeof raw==='string'?JSON.parse(raw):raw;
    if(data?.version!==1){
      const old=oldSource(legacy.program);if(old)base.draft=old;
      const tape=oldSource(legacy.tape?.program);if(tape)base.works.push({id:'legacy-tape',name:legacy.tape.name||'以前的磁带',source:tape,prg:null,expanded:false,date:0});
      return base;
    }
    if(typeof data.draft==='string'&&data.draft.length<=32000)base.draft=data.draft;
    if(typeof data.name==='string')base.name=data.name.slice(0,60);
    base.expanded=data.expanded===true;
    const clean=p=>{
      if(!p||typeof p.prg!=='string'||p.prg.length>40000)return null;
      try{vicReadPRG(vicDecode(p.prg),p.expanded?4609:4097);return {prg:p.prg,expanded:p.expanded===true};}catch{return null;}
    };
    base.session=clean(data.session);
    for(const p of Array.isArray(data.works)?data.works.slice(0,40):[]){
      if(typeof p?.id!=='string'||typeof p?.name!=='string'||typeof p?.source!=='string'||p.source.length>32000)continue;
      const binary=p.prg?clean(p):null;if(p.prg&&!binary)continue;
      base.works.push({id:p.id.slice(0,80),name:p.name.slice(0,60),source:p.source,prg:binary?.prg||null,expanded:p.expanded===true,date:Number.isFinite(p.date)?p.date:0});
    }
  }catch{}
  return base;
}

function vicGlyphSource(rows){
 if(rows.length!==8||rows.some(n=>!Number.isInteger(n)||n<0||n>255))throw new Error("字形需要 8 个字节。");
 return '10 PRINT CHR$(147);\n20 FOR I=0 TO 511\n30 POKE 7168+I,PEEK(32768+I):NEXT I\n40 FOR I=0 TO 7:READ B:POKE 7176+I,B:NEXT\n50 POKE 36869,255\n60 FOR J=1 TO 44:PRINT CHR$(65);:NEXT\n70 DATA '+rows.join(',');
}

function vicWriteLibrary(storage,library,expected){
 const current=storage.getItem(VIC_STORE);
 if(current!==expected)throw new Error("另一页修改了作品。本页暂停自动保存，请先下载备份，再刷新以打开最新作品。");
 const next=JSON.stringify(library);if(next!==current)storage.setItem(VIC_STORE,next);return next;
}

class VICDesk {
 constructor({legacy={},onDiscover=()=>{}}={}){
  this.onDiscover=onDiscover;this.storageOK=true;
  try{this.savedRaw=localStorage.getItem(VIC_STORE);this.library=vicRestoreLibrary(this.savedRaw,legacy);}catch{this.library=vicRestoreLibrary(null,legacy);this.storageOK=false;}
  this.root=null;this.vic=null;this.loading=null;this.frameID=0;this.paused=false;this.sound=false;this.didRun=false;this.lastSave=0;this.lastRead=0;this.audioNodes=new Set();this.pendingPrint=false;this.powerCycled=false;
 }
 persist(capture=true){
  if(capture&&this.vic?.powered){const prg=this.vic.program();if(prg)this.library.session={prg:vicEncode(prg),expanded:this.vic.expanded};}
  try{this.savedRaw=vicWriteLibrary(localStorage,this.library,this.savedRaw??null);this.storageOK=true;}catch(error){this.storageOK=false;this.saveError=error.message;}
  const label=this.root?.querySelector('#vic-save-status');if(label)label.textContent=this.storageOK?'草稿已保存在本机':'保存失败，请下载备份';
  const note=this.root?.querySelector('#vic-storage-note');if(note&&!this.storageOK)note.textContent=this.saveError?.includes('另一页')?this.saveError:'浏览器无法保存（可能空间不足或禁止存储）。请立即下载 .bas 或 .prg 备份，刷新后可能丢失。';
  return this.storageOK;
 }
 say(message){const el=this.root?.querySelector('#vic-status');if(el)el.textContent=message;}
 async ensure(){
  if(!this.loading)this.loading=VIC20.create().then(v=>{this.vic=v;return v;}).catch(e=>{this.loading=null;throw new Error('模拟器没能启动。请使用支持 WebAssembly 的现代浏览器，再按开机重试。');});
  return this.loading;
 }
 async power(restore=true){
  this.say('电视正在亮起来……');const v=await this.ensure();v.boot(this.library.expanded);this.paused=false;this.didRun=false;
  if(restore&&this.library.session){v.boot(this.library.session.expanded);v.loadPRG(vicDecode(this.library.session.prg));this.library.expanded=v.expanded;this.say('欢迎回来。上次的程序已回到内存；输入 RUN 就能继续玩。');}
  else this.say('READY. 电脑准备好了。试着对它说 PRINT "HELLO"。');
  this.onDiscover(0);this.sync();this.persist();
 }
 sync(){
  if(!this.root)return;const powered=!!this.vic?.powered;
  this.root.querySelector('#vic-off').hidden=powered;
  this.root.querySelector('#vic-power').textContent=powered?'○ 关机':'● 开机';
  this.root.querySelector('#vic-power-led').classList.toggle('lit',powered);
  this.root.querySelector('#vic-memory').value=this.library.expanded?'expanded':'base';
  this.root.querySelector('#vic-pause').textContent=this.paused?'继续':'暂停';
  this.root.querySelector('#vic-sound').textContent=this.sound?'♫ 关闭声音':'♫ 打开声音';this.root.querySelector('#vic-sound').setAttribute('aria-pressed',String(this.sound));
 }
 mount(root){
  this.unmount();this.root=root;this.paused=false;
  root.querySelector('#vic-name').value=this.library.name;root.querySelector('#vic-source').value=this.library.draft;
  this.sync();this.renderWorks();this.persist(false);
  root.addEventListener('input',e=>{if(e.target.id==='vic-source')this.library.draft=e.target.value.slice(0,32000);else if(e.target.id==='vic-name')this.library.name=e.target.value;else return;this.persist(false);});
  root.addEventListener('submit',e=>{if(e.target.id==='vic-command-form'){e.preventDefault();this.guard(async()=>{await this.send(root.querySelector('#vic-command').value);root.querySelector('#vic-command').value='';});}});
  root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
   if(b.dataset.vic)this.guard(()=>this.action(b.dataset.vic));
   if(b.dataset.vicCommand){root.querySelector('#vic-command').value=b.dataset.vicCommand;root.querySelector('#vic-command').focus();}
   if(b.dataset.vicStarter)this.guard(()=>this.starter(b.dataset.vicStarter));
   if(b.dataset.vicOpen)this.guard(()=>this.openWork(b.dataset.vicOpen));
   if(b.dataset.vicDelete)this.guard(()=>this.deleteWork(b.dataset.vicDelete));
   if(b.dataset.vicKey&&e.detail===0&&this.vic?.powered){const code=+b.dataset.vicKey;this.vic.key(code);setTimeout(()=>this.vic?.key(code,false),120);}
  });
  root.addEventListener('change',e=>{if(e.target.id==='vic-import')this.guard(()=>this.importFile(e.target.files[0]));if(e.target.id==='vic-memory')this.guard(async()=>{const expanded=e.target.value==='expanded';if(!this.archiveMachine()) {this.sync();return;}this.library.expanded=expanded;await this.power(false);this.say('内存已更换。旧程序在作品盒里，可以重新载入合适的作品。');});});
  const canvas=root.querySelector('#vic-screen');
  canvas.addEventListener('keydown',e=>{const code=this.keyCode(e);if(code===null||!this.vic?.powered)return;e.preventDefault();if(e.key==='Escape'){this.action('stop');return;}if(!e.repeat)this.vic.key(code);});
  canvas.addEventListener('keyup',e=>{const code=this.keyCode(e);if(code!==null){e.preventDefault();this.vic?.key(code,false);if(/^[a-z]$/i.test(e.key)){this.vic?.key(e.key.toUpperCase().charCodeAt(0),false);this.vic?.key(e.key.toLowerCase().charCodeAt(0),false);}}});
  canvas.addEventListener('blur',()=>this.vic?.release());
  root.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-vic-key]');if(!b||!this.vic?.powered)return;e.preventDefault();b.setPointerCapture(e.pointerId);this.vic.key(+b.dataset.vicKey);});
  for(const event of ['pointerup','pointercancel','lostpointercapture'])root.addEventListener(event,e=>{const b=e.target.closest('[data-vic-key]');if(b)this.vic?.key(+b.dataset.vicKey,false);});
  this.lastTick=performance.now();this.loop();
  if(!this.vic&&this.library.session)this.guard(()=>this.power());
 }
 prepareReset(){
  if(this.vic?.busy)this.vic.stop();
  try{this.archiveMachine();}catch(error){if(!confirm(error.message+'\n仍要重新开机吗？当前内存将丢失，代码本与已有作品会保留。'))throw new Error('没有重启，电脑还停在原处。');}
 }
 keyCode(e){if(e.ctrlKey||e.metaKey||e.altKey)return null;const map={Enter:13,Backspace:1,Delete:1,ArrowLeft:8,ArrowRight:9,ArrowDown:10,ArrowUp:11,Escape:3,F1:241,F2:242,F3:243,F4:244,F5:245,F6:246,F7:247,F8:248};return map[e.key]??(e.key.length===1&&e.key.charCodeAt(0)>=32&&e.key.charCodeAt(0)<=126?(e.shiftKey&&/^[a-z]$/i.test(e.key)?e.key.toLowerCase():e.key.toUpperCase()).charCodeAt(0):null);}
 unmount(){if(!this.root)return;cancelAnimationFrame(this.frameID);this.vic?.release();this.persist();this.silence();this.root=null;}
 hidden(){this.vic?.release();this.silence();this.persist();}
 loop(){
  if(!this.root)return;const now=performance.now();
  if(this.vic?.powered&&!this.paused&&!document.hidden){try{
   this.vic.advance(Math.min(40000,Math.max(0,now-this.lastTick)*1000));
   const c=this.root.querySelector('#vic-screen');c.getContext('2d').putImageData(new ImageData(this.vic.frame(),232,272),0,0);
   this.playAudio(this.vic.audio());
   if(this.vic.busy)this.say(`正在把代码敲进老电脑……还剩 ${this.vic.queue.length} 个字符。RUN/STOP 可中断。`);
   else if(this.wasBusy){this.say('输入送到了。看看电视：它会运行程序，也会用报错告诉你哪里需要修改。');this.persist();}
   this.wasBusy=this.vic.busy;
   if(now-this.lastRead>700){const screen=this.vic.screenText();this.root.querySelector('#vic-screen-text').textContent=screen;this.lastRead=now;if(this.pendingPrint&&!this.vic.busy){if(!screen.includes('?')&&screen.includes('READY.'))this.onDiscover(1);this.pendingPrint=false;}}
  }catch{this.paused=true;this.vic.release();this.silence();this.sync();this.say('电脑卡住了，时间已暂停。代码本还在；打开小手册，按“重新开机”可以重新开始。');}}
  if(now-this.lastSave>1500){this.persist();this.lastSave=now;}
  this.lastTick=now;this.frameID=requestAnimationFrame(()=>this.loop());
 }
 async guard(fn){try{await fn();}catch(e){this.say(e.message||'这次没成功，原来的草稿还在。');}}
 async send(text){if(!text.trim())return;if(!this.vic?.powered)throw new Error('先按开机键，再对电脑说话。');if(this.paused){this.paused=false;this.sync();}vicInput(text);this.vic.type(text);if(/^PRINT\b/i.test(text.trim()))this.pendingPrint=true;if(/^RUN\b/i.test(text.trim()))this.didRun=true;this.say('指令已经送到原机键盘缓冲区。');}
 setDraft(source,name){this.library.draft=source;this.library.name=name;this.root.querySelector('#vic-source').value=source;this.root.querySelector('#vic-name').value=name;this.persist(false);}
 addWork(source,prg=null,name=this.library.name){
  const expanded=this.vic?.powered?this.vic.expanded:this.library.expanded;
  if(this.library.works.some(w=>w.source===source&&w.prg===prg&&w.expanded===expanded))return true;
  if(this.library.works.length>=40)throw new Error('作品盒的 40 个位置满了。先下载并移走一个旧作品，再继续。');
  const work={id:`${Date.now()}-${Math.random().toString(36).slice(2,8)}`,source,prg,name:name.trim()||'未命名作品',expanded,date:Date.now()};
  this.library.works.unshift(work);

function reader() {
  const l=lessons[current], era=eras[l.chapter], isEnd=current===era.end-1;
  return `<div class="reader-layout era-theme-${l.chapter}">${sidebar()}<article class="reader-content"><div class="reader-topline"><span>${era.year} <i></i> ${era.machine}</span><span>第 ${current-era.start+1} / ${era.end-era.start} 节</span></div><div class="reading-spread"><div class="story-column"><span class="eyebrow">${l.kicker||`CHAPTER 0${l.chapter+1} / 亲手试一试`}</span><h1>${l.title.replace('\n','<br>')}</h1><p class="story-intro">${l.intro}</p><div class="mission"><span class="mission-star">✳</span><div><span class="eyebrow">你的挑战</span><p>${l.task}</p></div></div><details class="deeper"><summary>为什么会这样？ <span>+</span></summary>${l.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}<p>${l.deeper}</p></details><details class="source-details"><summary>年代与资料 ↗</summary><div class="sources">${l.source.map(s=>`<a href="${sources[s].url}" target="_blank" rel="noopener noreferrer">${sources[s].label} ↗</a>`).join('')}</div></details></div><section class="lab ${l.lab?'world-lab':''}" aria-label="${l.short}互动实验">${l.lab?labHeader('年代实验室',era.machine)+`<div id="world-content">${renderLab(l.lab,replayLab(l.lab,state.labs[l.lab]))}</div>`:current===3?bitsLab():current===4?pixelLab():terminalLab()}</section></div><div class="lesson-footer"><div><span id="lesson-status"></span><p>${l.takeaway}</p></div><div class="lesson-pagination">${current>0?`<a class="previous" href="#read/${current-1}" aria-label="上一节">←</a>`:''}<a class="button primary" href="${current<totalLessons-1?`#read/${current+1}`:'#ending'}">${current===totalLessons-1?'翻到最后一页':isEnd?'进入下一个时代':'下一小节'} →</a></div></div>${isEnd?`<div class="chapter-ending"><span class="eyebrow">这一站，你带走了什么？</span><h2>${['你开始告诉电脑，<br>可以怎么玩。','机器能做更多事。<br>你也能问更多问题。','打开的源码，<br>让好奇心继续传递。','房间很小，<br>网络把世界接了进来。','外形一直变，<br>每一个 bit 都有迹可循。'][l.chapter]}</h2></div>`:''}</article></div>`;
}
function ending() {
  const next=lessons.findIndex((_,i)=>!state.completed.includes(i));
  return `<section class="ending-page"><span class="eyebrow">THE END / 也是新的开始</span><h1>好奇心，<br>是最好的开机键。</h1><div class="ending-bit">0 <span>→</span> 1</div><p>从外祖父的电脑，到口袋里的世界。<br>你已经亲手留下 ${state.completed.length} / ${totalLessons} 个发现。</p><div class="ending-path">${eras.map((e,i)=>`<a href="#read/${e.start}"><span>${e.icon}</span><b>0${i+1}</b><small>${state.completed.filter(n=>n>=e.start&&n<e.end).length}/${e.end-e.start}</small></a>`).join('')}</div><p>电脑的故事还在继续。<br>下一次，你想让它做什么？</p><div class="world-controls">${next>=0?`<a class="button primary" href="#read/${next}">继续一个还没完成的发现 ↗</a>`:'<button class="button primary" id="ending-notebook">翻开我的探索手记 ↗</button>'}<a class="plain-link" href="#journey">重新走一遍时光目录</a></div></section>`;
}
function refreshWorld(focus) {
  const key=lessons[current]?.lab;if(!key)return;
  const model=replayLab(key,state.labs[key]);
  $('#world-content').innerHTML=renderLab(key,model);
  if(model.done)complete(current);
  if(focus){const target=[...document.querySelectorAll('[data-world]')].find(el=>el.dataset.world===focus.type&&el.dataset.value===focus.value);target?.focus({preventScroll:true});}
}
function actWorld(type,value,focus,render=true) {
  const key=lessons[current]?.lab;if(!key)return;
  if(['pause','address','value','select','paint','depth','flip','speed','deliver','drop','tap','byte','sample'].includes(type))value=Number(value);
  const event=cleanLabAction(key,{type,value});if(!event){toast('请输入这个实验允许的值。');return false;}
  const log=state.labs[key]||[];
  if(log.length>=LAB_ACTION_LIMIT){toast('这个实验已经操作 256 次。重置后可以继续，手记里的发现会保留。');return;}
  state.labs[key]=[...log,event];save();if(render)refreshWorld(focus);return true;
}

function route() {
  desk.unmount();
  const hash = location.hash || '#cover';
  const match = hash.match(/^#read\/(\d{1,2})$/);
  current = match && +match[1]<totalLessons ? +match[1] : -1;
  if (current >= 0) {state.lastLesson = current; save();}
  $('#main').innerHTML = current>=0?reader():hash==='#journey'?journey():hash==='#ending'?ending():hash==='#computer'?`<div class="free-computer-page">${vicDeskMarkup()}</div>`:cover();
  document.body.classList.toggle('reading',current>=0);
  document.body.classList.toggle('large-type',state.largeType);
  document.title = current>=0?`${lessons[current].short} · Every Bit`:'Every Bit · 可以玩的计算机小史';
  updateProgress(); if($('#vic-desk'))desk.mount($('#vic-desk')); if(current===3) updateBits(); if(current===4) updatePixels();
  window.scrollTo({top:0,behavior:'instant'});
  $('#main').focus({preventScroll:true});
}
function updateBits() {
  const bits=toBits(state.bits);
  document.querySelectorAll('[data-bit]').forEach(el=>{const on=bits[+el.dataset.bit]==='1';el.classList.toggle('active',on);el.setAttribute('aria-pressed',String(on));$('b',el).textContent=on?'1':'0';});
  $('#binary-readout').textContent=bits;$('#decimal-readout').textContent=state.bits;
  $('#letter-readout').textContent=state.bits>=65&&state.bits<=90?String.fromCharCode(state.bits):'—';
  const terms=Array.from({length:8},(_,i)=>128>>i).filter(n=>state.bits&n);
  $('#bit-sum').textContent=`${terms.length?terms.join(' + '):'没有亮着的开关'} = ${state.bits}`;
  $('#bit-feedback').textContent=state.bits===65?'你找到 A 了！01000001 → 65 → A。':state.bits>=65&&state.bits<=90?`你找到了 ${String.fromCharCode(state.bits)}。再试试 A 的号码 65。`:'这里先显示 65–90 对应的大写字母。其他数值也有各自的编码含义。';
}
function updatePixels() {
  const rows=glyphRows(state.pixels);
  document.querySelectorAll('[data-pixel]').forEach(el=>{const v=!!state.pixels[+el.dataset.pixel];el.classList.toggle('lit',v);el.setAttribute('aria-pressed',String(v));});
  document.querySelectorAll('[data-row]').forEach(el=>{const row=+el.dataset.row;el.classList.toggle('selected',row===selectedRow);el.setAttribute('aria-pressed',String(row===selectedRow));$('code',el).textContent=toBits(rows[row]);$('b',el).textContent=rows[row];});
  $('#pixel-explanation').textContent=`第 ${selectedRow+1} 行：${toBits(rows[selectedRow])} → ${rows[selectedRow]}。全画布已点亮 ${state.pixels.reduce((a,b)=>a+b,0)} 个点。`;
  if(rowSelected&&state.pixels.reduce((a,b)=>a+b,0)>=8)complete(4);
}
function notebook() {
  lastFocused=document.activeElement;
  $('#notebook-content').innerHTML=`<p class="notebook-summary">${state.completed.length===totalLessons?'整本书的 23 个发现，你都亲手试过了！':`已经收集 ${state.completed.length} / ${totalLessons} 个小发现。`}</p><div class="notebook-list">${lessons.map((l,i)=>`<a href="#read/${i}" data-notebook-link><span class="note-check ${state.completed.includes(i)?'done':''}">${state.completed.includes(i)?'✓':'○'}</span><div><b>${l.short}</b><p>${state.completed.includes(i)?l.takeaway:'去这一页，亲手试一试。'}</p></div><span>↗</span></a>`).join('')}</div>`;
  save();$('#notebook').showModal();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a');if(!t)return;
  if(t.classList.contains('skip-link')) {e.preventDefault();$('#main').focus();$('#main').scrollIntoView();return;}
  if(t.id==='notebook-button'||t.id==='ending-notebook')notebook();
  if(t.hasAttribute('data-world')){
    if(t.dataset.world==='write'&&lessons[current]?.lab==='memory'){
      const input=$('.byte-input'), value=Number(input.value);
      if(input.value===''||!Number.isInteger(value)||value<0||value>255){toast('字节请输入 0 到 255 之间的整数。');input.focus();return;}
      const model=replayLab('memory',state.labs.memory);
      if(model.value!==value&&!actWorld('value',value,null,false))return;
    }
    actWorld(t.dataset.world,t.dataset.value,{type:t.dataset.world,value:t.dataset.value});return;
  }
  if(t.hasAttribute('data-world-reset')){const key=lessons[current]?.lab;if(key){state.labs[key]=[];save();refreshWorld();}return;}
  if(t.matches('[data-close-dialog],[data-notebook-link]'))$('#notebook').close();
  if(t.id==='font-toggle') {state.largeType=!state.largeType;document.body.classList.toggle('large-type',state.largeType);t.setAttribute('aria-pressed',String(state.largeType));save();}
  if(t.hasAttribute('data-bit')) {state.bits^=128>>+t.dataset.bit;save();updateBits();if(state.bits===65)complete(3);}
  if(t.hasAttribute('data-pixel')) {const i=+t.dataset.pixel;state.pixels[i]=1-state.pixels[i];selectedRow=Math.floor(i/8);save();updatePixels();}
  if(t.hasAttribute('data-row')) {selectedRow=+t.dataset.row;rowSelected=true;updatePixels();}
  switch(t.dataset.action) {
    case 'reset-bits':state.bits=0;save();updateBits();break;
    case 'clear-pixels':state.pixels.fill(0);save();updatePixels();break;
    case 'send-glyph':desk.guard(()=>{desk.archiveDraft();desk.library.draft=vicGlyphSource(glyphRows(state.pixels));desk.library.name='我的像素朋友';desk.persist(false);location.hash='#computer';});break;
  }
});
document.addEventListener('change',e=>{if(e.target.hasAttribute('data-world-input')){
  const value=Number(e.target.value);
  if(e.target.value!==''&&actWorld(e.target.dataset.worldInput,value,null,false)){const code=$('.big-code');if(code)code.textContent=`${toBits(value)} = ${value}${value===65?' = A':''}`;}
  else {e.target.value=replayLab(lessons[current].lab,state.labs[lessons[current].lab]).value;toast('字节请输入 0 到 255 之间的整数。');}
}});
document.addEventListener('submit',e=>{if(e.target.hasAttribute('data-world-form')){e.preventDefault();actWorld(e.target.dataset.worldForm,new FormData(e.target).get('value'));return;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#vic-desk')&&!$('#notebook').open){desk.guard(()=>desk.action('stop'));}});
$('#notebook').addEventListener('close',()=>lastFocused?.isConnected&&lastFocused.focus());
$('#notebook').addEventListener('click',e=>{if(e.target===$('#notebook')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
window.addEventListener('hashchange',route);
document.addEventListener('visibilitychange',()=>{if(document.hidden)desk.hidden();});
window.addEventListener('pagehide',()=>{desk.hidden();save();});
$('#font-toggle').setAttribute('aria-pressed',String(state.largeType));
route();save();

})();
</script>
</body>
</html>
